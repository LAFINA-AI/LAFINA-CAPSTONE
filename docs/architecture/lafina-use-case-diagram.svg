<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1660" viewBox="0 0 1400 1660" role="img" aria-labelledby="title description">
<title id="title">LAFINA core student use case diagram</title>
<desc id="description">A student, as a guest or signed-in user, manages local plans, notes, reminders, and assistant requests. COR imports and assistant changes require review. Push-to-talk optionally extends chat. Handbook questions retrieve evidence. Android supports alerts. The external LAFINA backend supports optional accounts, sync, online chat, and live voice.</desc>
