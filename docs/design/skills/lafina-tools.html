'focus', 'short', 'long'].map(function (k) {\n        var on = k === mode;\n        return { label: MODES[k].label, on: on, bg: on ? '#FFFFFF' : 'transparent', ink: on ? '#14142B' : '#5E5E73', fw: on ? '600' : '400', shadow: on ? '0 2px 8px rgba(38,28,120,.08)' : 'none', pick: function () { setMode(k); } };\n      }),\n      accent: M.accent, soft: M.soft, glow: M.glow,\n      offset: (691.15 * (1 - remaining / M.secs)).toFixed(2),\n      clock: (mm < 10 ? '0' : '') + mm + ':' + (ss < 10 ? '0' : '') + ss,\n      status: running ? M.name : (remaining === M.secs ? 'Ready' : 'Paused'),\n      running: running, paused: !running,\n      playLabel: running ? 'Pause' : 'Start',\n      toggle: function () {\n        if (running) { stop(); self.setState({ running: false }); return; }\n        self.setState({ running: true });\n        clearInterval(self._iv);\n        self._iv = setInterval(function () {\n          var st = self.state || {};\n          var r = (st.remaining != null ? st.remaining : MODES[st.mode || 'focus'].secs) - 1;\n          if (r <= 0) { finish(); } else { self.setState({ remaining: r }); }\n        }, 1000);\n      },\n      reset: function () { stop(); self.setState({ remaining: M.secs, running: false }); },\n      skip: function () { finish(); },\n      dots: [0, 1, 2, 3].map(function (i) { return { bg: i < done ? M.accent : '#DCDCE6' }; }),\n      sessionText: 'Session ' + (done + 1) + ' of 4 · long break after 4',\n      todayText: sessions + (sessions === 1 ? ' session' : ' sessions') + ' · ' + (sessions * 25) + ' min',\n      dnd: dnd,\n      dndTrack: dnd ? '#5442E0' : '#D9D8E4',\n      dndKnob: dnd ? 'translateX(18px)' : 'none',\n      toggleDnd: function () { self.setState({ dnd: !dnd }); }\n    };\n  }\n}\n"}, "Flashcards": {"title": "Flashcards", "css": "\nbody{margin:0}\na{color:#4433C9}a:hover{color:#3B2CB8}\nbutton,input,textarea{font-family:inherit}\n@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}\n@ \">{{score}}<\/span><span style=\"font-size: 13px; color: #626277\">correct<\/span><\/div>\n    <\/div>\n    <p style=\"margin: 22px 0 0; font-size: 24px; font-weight: 600\">{{resultTitle}}<\/p>\n    <p style=\"margin: 8px 0 0; font-size: 15px; line-height: 1.5; color: #626277\">{{resultText}}<\/p>\n    <div style=\"margin-top: 28px; width: 100%; display: flex; flex-direction: column; gap: 10px\">\n      <a href=\"Flashcards.dc.html\" style=\"height: 56px; border-radius: 18px; background: #5442E0; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none\">Make flashcards from mistakes<\/a>\n      <button onClick=\"{{retry}}\" style=\"height: 52px; border: 1.5px solid #E2E1EC; border-radius: 16px; background: #FFFFFF; color: #14142B; font-size: 15px; font-weight: 500; cursor: pointer\">Retake quiz<\/button>\n    <\/div>\n  <\/div>\n  <\/sc-if>\n\n<\/div>\n", "js": "\nclass Component extends DCLogic {\n  renderVals() {\n    var self = this;\n    var s = this.state || {};\n    var QS = [\n      { text: 'Which cloud model gives you virtual machines that you manage yourself?', options: ['IaaS', 'SaaS', 'PaaS', 'On-premise'], answer: 0, explain: 'With IaaS you rent the infrastructure and manage the operating system and apps yourself.' },\n      { text: 'Google Docs is an example of…', options: ['IaaS', 'PaaS', 'SaaS', 'A private cloud'], answer: 2, explain: 'SaaS is finished software you use over the internet without installing or maintaining it.' },\n      { text: 'What lets one physical server run several operating systems at once?', options: ['Caching', 'Virtualization', 'Load balancing', 'Compression'], answer: 1, explain: 'Virtualization splits one machine into several virtual machines, each with its own OS.' },\n      { text: 'A cloud used by only one organization is called a…', options: ['Public cloud', 'Community cloud', 'Hybrid cloud', 'Private cloud'], answer: 3, explain: 'A private cloud is dedicated to a single organization, on-site or hosted.' },\n      { text: 'Paying only for the computing you actually use is called…', options: ['Fixed licensing', 'Pay-as-you-go', 'Capital expense', 'Prepaid hosting'], answer: 1, explain: 'Pay-as-you-go pricing bills you for actual usage, one of the main benefits of cloud.' }\n    ];\n    var NOTES = [\n      { id: 'n1', title: 'Lecture 4 – Cloud models', meta: 'IT Elective 3 · 2,140 words' },\n      { id: 'n2', title: 'Lecture 5 – Virtualization', meta: 'IT Elective 3 · 1,620 words' },\n      { id: 'n3', title: 'Software Eng. reviewer', meta: 'Software Engineering · 3,050 words' }\n    ];\n    var picked = s.notes || { n1: true, n2: true };\n    var count = s.count != null ? s.count : 0;\n    var type = s.type || 'mc';\n    var phase = s.phase || 'setup';\n    var qi = s.qi || 0;\n    var choice = s.choice;\n    var score = s.score || 0;\n    var Q = QS[Math.min(qi, QS.length - 1)];\n    var answered = choice != null;\n    var correct = answered && choice === Q.answer;\n    var KEYS = ['A', 'B', 'C', 'D'];\n    function seg(list, cur, key) {\n      return list.map(function (l, i) {\n        var on = i === cur;\n        return { label: l, on: on, bg: on ? '#FFFFFF' : 'transparent', ink: on ? '#14142B' : '#5E5E73', fw: on ? '600' : '400', shadow: on ? '0 2px 8px rgba(38,28,120,.08)' : 'none', pick: function () { var o = {}; o[key] = i; self.setState(o); } };\n      });\n    }\n    return {\n      isSetup: phase === 'setup', isQuiz: phase === 'quiz', isResult: phase === 'result',\n      notes: NOTES.map(function (n, i) {\n        return { title: n.title, meta: n.meta, on: !!picked[n.id], divider: i ? '1px solid #F0EFF6' : '0', toggle: function () { var p = Object.assign({}, picked); p[n.id] = !p[n.id]; self.setState({ notes: p }); } };\n      }),\n      counts: seg(['5', '10', '20'], count, 'count'),\n      types: [['mc', 'Multiple choice'], ['tf', 'True or false'], ['mix', 'Mixed']].map(function (t) {\n        var on = t[0] === type;\n        return { label: t[1], on: on, border: on ? '1.5px solid #5442E0' : '1.5px solid #E2E1EC', bg: on ? '#EEECFD' : '#FFFFFF', ink: on ? '#3B2CB8' : '#3F3F55', pick: function () { self.setState({ type: t[0] }); } };\n      }),\n      start: function () { self.setState({ phase: 'quiz', qi: 0, choice: null, score: 0 }); },\n      progress: Math.round(((qi + (answered ? 1 : 0)) / QS.length) * 100) + '%',\n      qCounter: (qi + 1) + ' of ' + QS.length,\n      currentQ: [{ key: qi, text: Q.text, options: Q.options.map(function (o, i) {\n        var isAns = i === Q.answer, isPick = i === choice;\n        var state = !answered ? 'idle' : isAns ? 'right' : isPick ? 'wrong' : 'dim';\n        return {\n          key: KEYS[i], text: o, picked: isPick, delay: (i * 0.04) + 's',\n          right: state === 'right', wrong: state === 'wrong',\n          border: state === 'right' ? '2px solid #1F8A5B' : state === 'wrong' ? '2px solid #D92D20' : '1.5px solid #E6E5EF',\n          bg: state === 'right' ? '#E5F5EC' : state === 'wrong' ? '#FEF3F2' : '#FFFFFF',\n          keyBg: state === 'right' ? '#1F8A5B' : state === 'wrong' ? '#D92D20' : '#F2F1F9',\n          keyInk: state === 'right' || state === 'wrong' ? '#FFFFFF' : '#3F3F55',\n          pick: function () { if (answered) return; self.setState({ choice: i, score: score + (i === Q.answer ? 1 : 0) }); }\n        };\n      }) }],\n      answered: answered,\n      fbBg: correct ? '#E5F5EC' : '#FEF3F2',\n      fbInk: correct ? '#1A7550' : '#B42318',\n      fbTitle: correct ? 'Correct!' : 'Not quite. The answer is ' + Q.options[Q.answer] + '.',\n      explain: Q.explain,\n      nextLabel: qi + 1 < QS.length ? 'Next question' : 'See results',\n      next: function () {\n        if (qi + 1 < QS.length) self.setState({ qi: qi + 1, choice: null });\n        else self.setState({ phase: 'result' });\n      },\n      score: score + '/' + QS.length,\n      scoreOffset: (452.4 * (1 - score / QS.length)).toFixed(1),\n      resultTitle: score === QS.length ? 'Perfect score!' : score >= 3 ? 'Nice work' : 'Keep practicing',\n      resultText: score === QS.length ? 'You know this lecture well.' : 'You missed ' + (QS.length - score) + '. Turn them into flashcards to review later.',\n      retry: function () { self.setState({ phase: 'quiz', qi: 0, choice: null, score: 0 }); }\n    };\n  }\n}\n"}, "Gwa": {"title": "GWA calculator", "css": "\nbody{margin:0}\na{color:#4433C9}a:hover{color:#3B2CB8}\nbutton,input,textarea{font-family:inherit}\n@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}\n@keyframes pop{0%{opacity:0;transform:scale(.6)}60%{opacity:1;transform:scale(1.1)}100%{opacity:1;transform:scale(1)}}\n@keyframes deal{from{opacity:0;transform:translateY(24px) rotate(-3deg)}to{opacity:1;transform:none}}\n@keyframes draw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}\n@keyframes halo{0%{transform:scale(1);opacity:.4}100%{transform:scale(1.7);opacity:0}}\n@keyframes wave{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}\n@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}\n@keyframes breatheSoft{0%,100%{transform:scale(.96);opacity:.55}50%{transform:scale(1.04);opacity:1}}\n@keyframes scoreIn{from{stroke-dashoffset:452.4}}\n.a-up{animation:up .45s cubic-bezier(.2,.8,.2,1) both}\n.a-pop{animation:pop .4s cubic-bezier(.2,.8,.2,1) both}\n.a-deal{animation:deal .5s cubic-bezier(.2,.8,.2,1) both}\n.draw{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .35s ease .05s forwards}\n.halo{animation:halo 2.2s ease-out infinite}\n.wave{animation:wave 1s ease-in-out infinite;transform-origin:center}\n.blink{animation:blink 1.2s ease-in-out infinite}\n.breathe-soft{animation:breatheSoft 4s ease-in-out infinite}\n.score-ring{animation:scoreIn 1.2s cubic-bezier(.2,.8,.2,1) .2s both}\n.press{transition:transform .12s ease}.press:active{transform:scale(.94)}\n.track{transition:background .2s ease}.knob{transition:transform .2s cubic-bezier(.2,.8,.2,1)}\n.card3d{transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.8,.2,1)}\n.face{backface-visibility:hidden;-webkit-backface-visibility:hidden}\n.back{transform:rotateY(180deg)}\n.field{transition:border-color .2s ease, box-shadow .2s ease}\n.field:focus-within{border-color:#5442E0 !important;box-shadow:0 0 0 4px #EEECFD}\n@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition:none!important}}\n", "html": "\n<div style=\"width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Lexend', system-ui, sans-serif; color: #14142B; background: #FAFAFD\">\n  <div style=\"height: 64px; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 8px\">\n    <a href=\"ToolsHubA.dc.html\" aria-label=\"Back to Tools\" style=\"width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #14142B\"><svg aria-hidden=\"true\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19 12H5M11 18l-6-6 6-6\"><\/path><\/svg><\/a>\n    <h1 style=\"flex: 1; min-width: 0; margin: 0; font-size: 20px; font-weight: 600\">GWA calculator<\/h1>\n    \n  <\/div>\n\n  <div class=\"a-up\" style=\"margin: 4px 20px 0; border-radius: 24px; background: #1B1640; color: #FFFFFF; padding: 18px 20px; display: flex; align-items: center; gap: 16px\">\n    <div style=\"flex: 1; min-width: 0\">\n      <p style=\"margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .1em; color: #C9C2F7\">YOUR GWA<\/p>\n      <p aria-live=\"polite\" style=\"margin: 4px 0 0; font-size: 46px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums\">{{gwa}}<\/p>\n      <p style=\"margin: 2px 0 0; font-size: 13px; color: rgba(255,255,255,.8)\">{{totals}}<\/p>\n    <\/div>\n    <div st stone Project 2', units: 3, grade: 1.5 },\n      { name: 'Software Engineering', units: 3, grade: 2.0 },\n      { name: 'Ethics', units: 3, grade: 1.25 },\n      { name: 'PE 4', units: 2, grade: 1.0 }\n    ];\n    var units = 0, pts = 0;\n    rows.forEach(function (r) { units += r.units; pts += r.units * r.grade; });\n    var gwa = units ? pts / units : 0;\n    function set(i, g) {\n      var n = rows.map(function (r) { return Object.assign({}, r); });\n      n[i].grade = Math.min(5, Math.max(1, Math.round(g * 4) / 4));\n      self.setState({ rows: n });\n    }\n    return {\n      gwa: gwa.toFixed(2),\n      totals: units + ' units · ' + rows.length + ' subjects',\n      marker: 'calc(' + ((gwa - 1) / 4 * 100).toFixed(1) + '% - 2px)',\n      rows: rows.map(function (r, i) {\n        var pass = r.grade <= 3;\n        return {\n          name: r.name, units: r.units + ' units', grade: r.grade.toFixed(2),\n          divider: i ? '1px solid #F0EFF6' : '0',\n          bg: pass ? (r.grade <= 1.75 ? '#E5F5EC' : '#F2F1F9') : '#FEF3F2',\n          ink: pass ? (r.grade <= 1.75 ? '#1A7550' : '#14142B') : '#B42318',\n          downLabel: 'Better grade for ' + r.name,\n          upLabel: 'Lower grade for ' + r.name,\n          down: function () { set(i, r.grade - 0.25); },\n          up: function () { set(i, r.grade + 0.25); }\n        };\n      }),\n      add: function () {\n        if (rows.length >= 7) return;\n        self.setState({ rows: rows.concat([{ name: 'New subject', units: 3, grade: 1.0 }]) });\n      }\n    };\n  }\n}\n"}, "Summarizer": {"title": "Summarizer", "css": "\nbody{margin:0}\na{color:#4433C9}a:hover{color:#3B2CB8}\nbutton,input,textarea{font-family:inherit}\n@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}\n@keyframes pop{0%{opacity:0;transform:scale(.6)}60%{opacity:1;transform:scale(1.1)}100%{opacity:1;transform:scale(1)}}\n@keyframes deal{from{opacity:0;transform:translateY(24px) rotate(-3deg)}to{opacity:1;transform <script>
(function () {
  'use strict';
  var PAGES = window.__PAGES__;
  var ORDER = window.__ORDER__;
  var screen = document.getElementById('screen');
  var pageStyle = document.getElementById('page-style');
  var picker = document.getElementById('picker');
  var current = null; // {name, comp, src, root}

  // ---------- helpers ----------
  function lookup(path, scope) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null') return null;

    }

  }

  var HOLE = /\{\{([^{}]+)\}\}/g;

    return str.replace(HOLE, function (_, p) {
      var v = lookup(p, scope);
      return v == null ? '' : String(v);
    });

    }

  }

  // ---------- render template -> fresh DOM ----------
  function renderChildren(src, scope, out) {
    for (var c = src.firstChild; c; c = c.nextSibling) renderNode(c, scope, out);
  }
  function renderNode(src, scope, out) {
    if (src.nodeType === 3) {
      out.push(document.createTextNode(interp(src.data, scope)));
      return;
    }

    var tag = src.localName;
    if (tag === 'sc-if') {
      var m = WHOLE.exec(src.getAttribute('value') || '');

})();
