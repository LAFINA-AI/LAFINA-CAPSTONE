
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Lexend', system-ui, sans-serif; color: #14142B; background: #FAFAFD">
  <div style="height: 64px; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 8px">
    <a href="ToolsHubA.dc.html" aria-label="Back to Tools" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #14142B"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg></a>
    <h1 style="flex: 1; min-width: 0; margin: 0; font-size: 20px; font-weight: 600">Meetings</h1>
    <button aria-label="Search recordings" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #F0EFF6; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14142B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></button>
  </div>

  <div class="a-up" style="margin: 4px 20px 0; height: 330px; box-sizing: border-box; border-radius: 26px; background: {{panelBg}}; padding: 20px; display: flex; flex-direction: column; align-items: center; position: relative; overflow: hidden; transition: background .4s ease">
    <sc-if value="{{idle}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column; align-items: center; text-align: center; margin-top: 30px">
        <button aria-label="Start recording" onClick="{{start}}" class="press" style="position: relative; width: 96px; height: 96px; border: 0; border-radius: 50%; background: #5442E0; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 14px 30px rgba(84,66,224,.35)">
          <span aria-hidden="true" class="halo" style="position: absolute; top: 0; left: 0; width: 96px; height: 96px; border-radius: 50%; background: #5442E0"></span>
          <svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: relative"><path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3ZM19 10v1a7 7 0 0 1-14 0v-1M12 18v4"></path></svg>
        </button>
        <p style="margin: 22px 0 0; font-size: 19px; font-weight: 600">Record a class or meeting</p>
        <p style="margin: 6px 0 0; font-size: 14px; line-height: 1.5; color: #626277; max-width: 270px">LAFINA writes the transcript, then a summary and any to-dos it hears.</p>
      </div>
    </sc-if>
    <sc-if value="{{recording}}" hint-placeholder-val="{{false}}">
      <div style="width: 100%; display: flex; flex-direction: column; height: 100%">
        <div style="display: flex; align-items: center; justify-content: space-between">
          <span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #FFFFFF"><span class="blink" style="width: 8px; height: 8px; border-radius: 50%; background: #F87171"></span>Recording</span>
          <span role="timer" style="font-size: 15px; font-weight: 600; color: #FFFFFF; font-variant-numeric: tabular-nums">{{elapsed}}</span>
        </div>
        <div aria-hidden="true" style="margin-top: 18px; display: flex; align-items: center; justify-content: center; gap: 4px; height: 48px">
          <sc-for list="{{bars}}" as="b" hint-placeholder-count="21"><span class="wave" style="width: 4px; height: {{b.h}}; border-radius: 2px; background: {{b.c}}; animation-delay: {{b.d}}"></span></sc-for>
        </div>
        <div aria-live="polite" style="margin-top: 16px; flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; overflow: hidden">
          <sc-for list="{{lines}}" as="l" hint-placeholder-count="2">
            <p class="a-up" style="margin: 0; font-size: 14px; line-height: 1.45; color: rgba(255,255,255,.92)"><span style="font-weight: 600; color: #C9C2F7">{{l.who}}</span> {{l.text}}</p>
          </sc-for>
          <sc-if value="{{todoFound}}" hint-placeholder-val="{{false}}">
            <span class="a-pop" style="align-self: flex-start; display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 10px; background: rgba(255,255,255,.14); font-size: 12px; color: #FFFFFF"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24"><path fill="#FFFFFF" d="M12 1.5c.9 5.6 4.9 9.6 10.5 10.5-5.6.9-9.6 4.9-10.5 10.5C11.1 16.9 7.1 12.9 1.5 12 7.1 11.1 11.1 7.1 12 1.5Z"></path></svg>To-do found: Report draft · Monday</span>
          </sc-if>
        </div>
        <div style="display: flex; justify-content: center; margin-top: 14px">
          <button aria-label="Stop recording" onClick="{{stop}}" style="width: 64px; height: 64px; border: 0; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><span style="width: 20px; height: 20px; border-radius: 5px; background: #D92D20"></span></button>
        </div>
      </div>
    </sc-if>
  </div>

  <div class="a-up" style="margin: 22px 20px 0; animation-delay: .06s">
    <p style="margin: 0 0 10px; font-size: 17px; font-weight: 600">Recent</p>
    <div style="background: #FFFFFF; border: 1px solid #ECEBF4; border-radius: 20px; padding: 0 14px">
      <sc-for list="{{recent}}" as="r" hint-placeholder-count="3">
        <button style="width: 100%; height: 72px; border: 0; border-top: {{r.divider}}; background: transparent; padding: 0; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer">
          <span style="width: 42px; height: 42px; flex-shrink: 0; border-radius: 12px; background: #F2F1F9; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3F3F55" stroke-width="2" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"></path></svg></span>
          <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 15px; font-weight: 500; color: #14142B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span><span style="display: block; font-size: 12px; color: #626277; margin-top: 2px">{{r.meta}}</span></span>
          <span style="padding: 4px 8px; border-radius: 8px; background: {{r.tagBg}}; color: {{r.tagInk}}; font-size: 11px; font-weight: 600">{{r.tag}}</span>
        </button>
      </sc-for>
    </div>
  </div>

</div>
