
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Lexend', system-ui, sans-serif; color: #14142B; background: #FAFAFD">
  <div style="height: 64px; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 8px">
    <a href="ToolsHubA.dc.html" aria-label="Back to Tools" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #14142B"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg></a>
    <h1 style="flex: 1; min-width: 0; margin: 0; font-size: 20px; font-weight: 600">GWA calculator</h1>
    
  </div>

  <div class="a-up" style="margin: 4px 20px 0; border-radius: 24px; background: #1B1640; color: #FFFFFF; padding: 18px 20px; display: flex; align-items: center; gap: 16px">
    <div style="flex: 1; min-width: 0">
      <p style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .1em; color: #C9C2F7">YOUR GWA</p>
      <p aria-live="polite" style="margin: 4px 0 0; font-size: 46px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums">{{gwa}}</p>
      <p style="margin: 2px 0 0; font-size: 13px; color: rgba(255,255,255,.8)">{{totals}}</p>
    </div>
    <div style="width: 92px; flex-shrink: 0">
      <div aria-hidden="true" style="position: relative; height: 8px; border-radius: 4px; background: rgba(255,255,255,.14)">
        <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 50%; border-radius: 4px; background: #34D399"></div>
        <div style="position: absolute; top: -5px; width: 4px; height: 18px; border-radius: 2px; background: #FFFFFF; left: {{marker}}; transition: left .35s cubic-bezier(.2,.8,.2,1)"></div>
      </div>
      <div style="display: flex; justify-content: space-between; margin-top: 8px; font-size: 11px; color: rgba(255,255,255,.75)"><span>1.00</span><span>3.00</span><span>5.00</span></div>
    </div>
  </div>
  <p class="a-up" style="margin: 10px 24px 0; font-size: 12px; line-height: 1.45; color: #626277; animation-delay: .03s">1.00 is the highest grade and 3.00 the lowest passing grade, in steps of 0.25 (2023 USTP Handbook, Ch. 14).</p>

  <div class="a-up" style="margin: 18px 20px 0; display: flex; align-items: baseline; justify-content: space-between; animation-delay: .06s">
    <p style="margin: 0; font-size: 17px; font-weight: 600">This semester</p>
    <span style="font-size: 13px; color: #626277">Grade</span>
  </div>
  <div class="a-up" style="margin: 10px 20px 0; background: #FFFFFF; border: 1px solid #ECEBF4; border-radius: 20px; padding: 0 8px 0 16px; animation-delay: .08s">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
      <div style="display: flex; align-items: center; gap: 10px; height: 62px; border-top: {{r.divider}}">
        <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span><span style="display: block; font-size: 12px; color: #626277">{{r.units}}</span></span>
        <div style="display: flex; align-items: center; gap: 2px">
          <button aria-label="{{r.downLabel}}" onClick="{{r.down}}" style="width: 40px; height: 40px; border: 0; border-radius: 12px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3F3F55" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"></path></svg></button>
          <span style="width: 58px; height: 36px; border-radius: 10px; background: {{r.bg}}; color: {{r.ink}}; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums">{{r.grade}}</span>
          <button aria-label="{{r.upLabel}}" onClick="{{r.up}}" style="width: 40px; height: 40px; border: 0; border-radius: 12px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3F3F55" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
        </div>
      </div>
    </sc-for>
  </div>
  <button class="a-up" onClick="{{add}}" style="margin: 10px 20px 0; width: 350px; height: 50px; border: 1.5px dashed #C9C2F7; border-radius: 16px; background: transparent; color: #4433C9; font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; animation-delay: .1s"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Add subject</button>

</div>
