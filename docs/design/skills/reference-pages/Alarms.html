
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Lexend', system-ui, sans-serif; color: #14142B; background: #FAFAFD">
  <div style="height: 64px; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 8px">
    <a href="ToolsHubA.dc.html" aria-label="Back to Tools" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #14142B"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg></a>
    <h1 style="flex: 1; min-width: 0; margin: 0; font-size: 20px; font-weight: 600">Alarms</h1>
    <button aria-label="New alarm" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #5442E0; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 6px 16px rgba(84,66,224,.3)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
  </div>

  <div class="a-up" style="margin: 4px 20px 0; border-radius: 24px; background: {{heroBg}}; color: #FFFFFF; padding: 18px 20px; position: relative; overflow: hidden; transition: background .3s ease">
    <svg aria-hidden="true" class="ring-bell" width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; right: -14px; top: -10px"><path d="M12 21a8 8 0 1 0 0-16 8 8 0 0 0 0 16ZM12 9v4l2 2M5 3 2 6M22 6l-3-3"></path></svg>
    <p style="position: relative; margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .1em; color: rgba(255,255,255,.85)">NEXT ALARM</p>
    <p style="position: relative; margin: 6px 0 0; font-size: 40px; font-weight: 600; letter-spacing: -.02em">{{nextTime}}</p>
    <p style="position: relative; margin: 2px 0 0; font-size: 14px; color: rgba(255,255,255,.88)">{{nextMeta}}</p>
  </div>

  <div class="a-up" style="margin: 14px 20px 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; animation-delay: .04s">
    <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
      <button aria-pressed="{{d.on}}" onClick="{{d.pick}}" style="height: 58px; border: 0; border-radius: 16px; background: {{d.bg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; cursor: pointer; padding: 0">
        <span style="font-size: 12px; font-weight: {{d.fw}}; color: {{d.ink}}">{{d.label}}</span>
        <span style="width: 5px; height: 5px; border-radius: 50%; background: {{d.dot}}"></span>
      </button>
    </sc-for>
  </div>

  <div class="a-up" style="margin: 20px 20px 0; display: flex; align-items: baseline; justify-content: space-between; animation-delay: .07s">
    <p style="margin: 0; font-size: 17px; font-weight: 600">{{listTitle}}</p>
    <span style="font-size: 13px; color: #626277">{{activeText}}</span>
  </div>
  <div class="a-up" style="margin: 10px 20px 0; background: #FFFFFF; border: 1px solid #ECEBF4; border-radius: 20px; padding: 0 16px; animation-delay: .09s">
    <sc-for list="{{alarms}}" as="a" hint-placeholder-count="3">
      <button role="switch" aria-checked="{{a.on}}" aria-label="{{a.aria}}" onClick="{{a.toggle}}" style="width: 100%; height: 84px; border: 0; border-top: {{a.divider}}; background: transparent; padding: 0; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer">
        <span style="flex: 1; min-width: 0">
          <span style="display: flex; align-items: baseline; gap: 4px"><span style="font-size: 30px; font-weight: 500; letter-spacing: -.02em; color: {{a.timeInk}}; transition: color .2s ease">{{a.time}}</span><span style="font-size: 14px; color: {{a.timeInk}}">{{a.ampm}}</span></span>
          <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #626277"><span>{{a.label}}</span><span aria-hidden="true">·</span><span>{{a.repeat}}</span></span>
        </span>
        <span class="track" style="width: 50px; height: 30px; flex-shrink: 0; border-radius: 15px; background: {{a.track}}; padding: 3px; box-sizing: border-box"><span class="knob" style="display: block; width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 3px rgba(0,0,0,.2); transform: {{a.knob}}"></span></span>
      </button>
    </sc-for>
  </div>

  <div class="a-up" style="margin: 14px 20px 0; border-radius: 16px; background: #EEECFD; padding: 12px 14px; display: flex; align-items: center; gap: 10px; animation-delay: .12s">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" style="flex-shrink: 0"><path fill="#5442E0" d="M12 1.5c.9 5.6 4.9 9.6 10.5 10.5-5.6.9-9.6 4.9-10.5 10.5C11.1 16.9 7.1 12.9 1.5 12 7.1 11.1 11.1 7.1 12 1.5Z"></path></svg>
    <span style="font-size: 13px; line-height: 1.45; color: #3B2CB8">Or just say it: “Wake me up at 6 on weekdays.”</span>
  </div>

</div>
