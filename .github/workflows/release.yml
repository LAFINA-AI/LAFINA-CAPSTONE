name: Release
# Pushing a version tag (v1.2.3, matching package.json) publishes a GitHub
# release that installed copies of LAFINA update to from inside the app.
# See docs/RELEASING.md. Needs these repository secrets (made by
# `npm run release:keygen`): LAFINA_RELEASE_KEYSTORE_BASE64,
# LAFINA_RELEASE_KEYSTORE_PASSWORD, LAFINA_UPDATE_KEY_PEM.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run preflight
  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      # A release already published for this tag (for example with
      # `npm run release -- --publish` from the owner's computer) is left alone.
      - name: Already published?
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::Release $GITHUB_REF_NAME already exists; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.existing.outputs.skip != 'true'
        uses: actions/checkout@v5
        with:
          # The last release's tag, to check what changed since.
          fetch-depth: 0
      - if: steps.existing.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: npm
      - if: steps.existing.outputs.skip != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - if: steps.existing.outputs.skip != 'true'
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - if: steps.existing.outputs.skip != 'true'
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - if: steps.existing.outputs.skip != 'true'
        run: npm ci --ignore-scripts
      # --ignore-scripts skips postinstall, so apply the react-native-tts patch explicitly.
      - if: steps.existing.outputs.skip != 'true'
        run: node scripts/patch-android-libs.mjs
      - name: Release signing key
        if: steps.existing.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.LAFINA_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LAFINA_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the LAFINA_RELEASE_KEYSTORE_BASE64 and LAFINA_RELEASE_KEYSTORE_PASSWORD secrets (see docs/RELEASING.md)."
            exit 1
          fi
          dir="$RUNNER_TEMP/lafina-signing"
          mkdir -p "$dir"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$dir/release.p12"
          {
            echo "storeFile=$dir/release.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=lafina"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > "$dir/signing.properties"
          echo "LAFINA_RELEASE_SIGNING=$dir/signing.properties" >> "$GITHUB_ENV"
      - name: Build, check, sign and publish
        if: steps.existing.outputs.skip != 'true'
        env:
          LAFINA_UPDATE_KEY_PEM: ${{ secrets.LAFINA_UPDATE_KEY_PEM }}
          LAFINA_GRADLE_ARGS: --no-daemon --max-workers=2
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-update.mjs --publish
      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/lafina-signing"
