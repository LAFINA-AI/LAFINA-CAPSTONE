apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.facebook.react'

react {
    autolinkLibrariesWithApp()
    extraPackagerArgs = ['--max-workers', '2']
}

// One version for the app: package.json's. The release tag (v<version>), the
// in-app update check and Android's versionName all read it from there.
def appVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version as String

// Release signing (in-app updates need every release signed with the same key).
// Read from a private properties file outside the repo, made by
// `npm run release:keygen`: LAFINA_RELEASE_SIGNING, else ~/.lafina/.
// Without it, release builds fall back to the debug key and are marked
// -preview; `npm run release` refuses to publish those.
def releaseSigningFile = file(System.getenv('LAFINA_RELEASE_SIGNING') ?:
    "${System.getProperty('user.home')}/.lafina/lafina-capstone-signing.properties")
def releaseSigning = new Properties()
if (releaseSigningFile.isFile()) {
    releaseSigningFile.withInputStream { releaseSigning.load(it) }
}
def hasReleaseSigning = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every { releaseSigning.getProperty(it) } &&
    file(releaseSigning.getProperty('storeFile')).isFile()

def targetAbis = (project.findProperty('reactNativeArchitectures') ?: 'arm64-v8a,x86_64').split(',')
def providerTesting = project.findProperty('lafinaProviderTesting') == 'true'
// ARMv7 has not been compiled or validated on a 32-bit phone. Opt in explicitly.
if (targetAbis.contains('armeabi-v7a') && project.findProperty('enableExperimentalArmv7') != 'true') {
    throw new GradleException('ARMv7 is experimental: add -PenableExperimentalArmv7=true to validate it separately.')
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion
    namespace 'com.lafina.capstone'
    defaultConfig {
        applicationId 'com.lafina.capstone'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Raise versionCode only when native code changes (Kotlin, C++, the manifest,
        // a native package). `npm run release` checks this against the last release:
        // phones on the same versionCode take a small JavaScript update, phones on
        // an older one install the new APK from inside the app.
        // 100: above every build number used before in-app updates (up to 11), so no
        // earlier test APK can look newer than a release.
        versionCode 101
        versionName appVersion
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'boolean', 'ENABLE_PLANNER_HARNESS', 'false'
        buildConfigField 'boolean', 'PERFORMANCE_HARNESS_ENABLED', 'false'
        // Debug and test builds only: a Profile setting that switches between
        // the Vercel backend and a backend on this computer. Off in release.
        buildConfigField 'boolean', 'ENABLE_BACKEND_SWITCH', 'false'
        // Test builds only: -PlafinaApiBaseUrl=http://127.0.0.1:8000 sends
        // online features to a backend on this computer (via adb reverse).
        buildConfigField 'String', 'API_BASE_URL_OVERRIDE', '""'
        buildConfigField 'boolean', 'PROVIDER_TESTING_ENABLED', 'false'
        buildConfigField 'String', 'DIRECT_ELEVEN_KEY', '""'
        buildConfigField 'String', 'DIRECT_DEEPSEEK_KEY', '""'
        buildConfigField 'String', 'DIRECT_AGENT_ID', '""'
        buildConfigField 'String', 'DIRECT_VOICE_ID', '""'
    }
    aaptOptions {
        noCompress "onnx", "bin"
    }
    // Separate ABI APKs avoid shipping other architectures to a low-end phone.
    splits {
        abi {
            enable true
            reset()
            include(*targetAbis)
            universalApk false
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseSigning.getProperty('storeFile'))
                storePassword releaseSigning.getProperty('storePassword')
                keyAlias releaseSigning.getProperty('keyAlias')
                keyPassword releaseSigning.getProperty('keyPassword')
                storeType 'PKCS12'
            }
        }
    }
    testBuildType 'dataQa'
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            buildConfigField 'boolean', 'ENABLE_PLANNER_HARNESS', 'true'
            buildConfigField 'boolean', 'ENABLE_BACKEND_SWITCH', 'true'
        }
        release {
            // Signed with the LAFINA release key when it is on this computer (or in CI);
            // otherwise a development preview on the debug key, never published.
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            versionNameSuffix hasReleaseSigning ? '' : '-preview'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        performance {
            initWith release
            applicationIdSuffix '.performance'
            buildConfigField 'boolean', 'PERFORMANCE_HARNESS_ENABLED', 'true'
            versionNameSuffix '-performance'
            matchingFallbacks = ['release']
        }
        // Private, debuggable data-layer review build: bundled JS, no Metro/network.
        // Same application ID/signature preserves the Phase 01 preview's settings.
        dataQa {
            initWith debug
            applicationIdSuffix providerTesting ? '.providers' : ''
            debuggable true
            // Match native debug headers/libraries; release prefabs lack debug symbols.
            matchingFallbacks = ['debug']
            versionNameSuffix '-data-qa'
            buildConfigField 'boolean', 'ENABLE_PLANNER_HARNESS', 'true'
            buildConfigField 'boolean', 'ENABLE_BACKEND_SWITCH', 'true'
            buildConfigField 'boolean', 'PROVIDER_TESTING_ENABLED', providerTesting.toString()
            if (providerTesting && project.findProperty('lafinaDirectProviders') == 'true') {
                ['DIRECT_ELEVEN_KEY', 'DIRECT_DEEPSEEK_KEY', 'DIRECT_AGENT_ID', 'DIRECT_VOICE_ID'].each { name ->
                    def value = System.getenv('LAFINA_TEST_' + name) ?: ''
                    if (!(value ==~ /[A-Za-z0-9_-]+/)) throw new GradleException('Missing or invalid direct provider test setting: ' + name)
                    buildConfigField 'String', name, '"' + value + '"'
                }
            }
            buildConfigField 'String', 'API_BASE_URL_OVERRIDE',
                "\"${(project.findProperty('lafinaApiBaseUrl') ?: (providerTesting ? 'http://127.0.0.1:8000' : '')).toString().replaceAll('[^A-Za-z0-9:/._-]', '')}\""
        }
    }
    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
            // Keep Windows Ninja object paths within its 260-character limit.
            // This remains inside this checkout, including in long workspace names.
            buildStagingDirectory file("../../.cxx")
        }
    }
}

dependencies {
    implementation('com.facebook.react:react-android')
    implementation('com.facebook.react:hermes-android')
    // AGY-PORT 11 / ADR-024: 1.19.2 ships 4 KiB-aligned PT_LOAD segments (fails 16 KiB pages).
    implementation('com.microsoft.onnxruntime:onnxruntime-android:1.22.0')
    implementation('com.google.android.gms:play-services-mlkit-text-recognition:19.0.1')
    // COR import: reads the portal COR PDF's own text layer exactly (Apache-2.0, offline).
    implementation('com.tom-roush:pdfbox-android:2.0.27.0')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
