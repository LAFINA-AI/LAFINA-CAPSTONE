apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.facebook.react'

react {
    autolinkLibrariesWithApp()
    extraPackagerArgs = ['--max-workers', '2']
}

def targetAbis = (project.findProperty('reactNativeArchitectures') ?: 'arm64-v8a,x86_64').split(',')
// ARMv7 has not been compiled or validated on a 32-bit phone. Opt in explicitly.
if (targetAbis.contains('armeabi-v7a') && project.findProperty('enableExperimentalArmv7') != 'true') {
    throw new GradleException('ARMv7 is experimental: add -PenableExperimentalArmv7=true to validate it separately.')
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion
    namespace 'com.lafina.capstone'
    defaultConfig {
        applicationId 'com.lafina.capstone'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 6
        versionName '0.6.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'boolean', 'ENABLE_PLANNER_HARNESS', 'false'
        // Debug and test builds only: a Profile setting that switches between
        // the Vercel backend and a backend on this computer. Off in release.
        buildConfigField 'boolean', 'ENABLE_BACKEND_SWITCH', 'false'
        // Test builds only: -PlafinaApiBaseUrl=http://127.0.0.1:8000 sends
        // online features to a backend on this computer (via adb reverse).
        buildConfigField 'String', 'API_BASE_URL_OVERRIDE', '""'
    }
    aaptOptions {
        noCompress "onnx", "bin"
    }
    // Separate ABI APKs avoid shipping other architectures to a low-end phone.
    splits {
        abi {
            enable true
            reset()
            include(*targetAbis)
            universalApk false
        }
    }
    testBuildType 'dataQa'
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            buildConfigField 'boolean', 'ENABLE_PLANNER_HARNESS', 'true'
            buildConfigField 'boolean', 'ENABLE_BACKEND_SWITCH', 'true'
        }
        release {
            // Development preview only. Never publish with the standard debug key.
            signingConfig signingConfigs.debug
            versionNameSuffix '-preview'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        // Private, debuggable data-layer review build: bundled JS, no Metro/network.
        // Same application ID/signature preserves the Phase 01 preview's settings.
        dataQa {
            initWith debug
            applicationIdSuffix ''
            debuggable true
            // Match native debug headers/libraries; release prefabs lack debug symbols.
            matchingFallbacks = ['debug']
            versionNameSuffix '-data-qa'
            buildConfigField 'boolean', 'ENABLE_PLANNER_HARNESS', 'true'
            buildConfigField 'boolean', 'ENABLE_BACKEND_SWITCH', 'true'
            buildConfigField 'String', 'API_BASE_URL_OVERRIDE',
                "\"${(project.findProperty('lafinaApiBaseUrl') ?: '').toString().replaceAll('[^A-Za-z0-9:/._-]', '')}\""
        }
    }
    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }
}

dependencies {
    implementation('com.facebook.react:react-android')
    implementation('com.facebook.react:hermes-android')
    // AGY-PORT 11 / ADR-024: 1.19.2 ships 4 KiB-aligned PT_LOAD segments (fails 16 KiB pages).
    implementation('com.microsoft.onnxruntime:onnxruntime-android:1.22.0')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
